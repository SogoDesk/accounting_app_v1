name: CI

on:
  # Every pull request, whatever its base branch (the repo also uses ganesh-dev).
  pull_request:
  push:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Migrations, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        # The baseline schema uses PostgreSQL 17+ syntax, so 16 cannot apply it.
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: books_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # migrate:up applies every migration to an empty database.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/books_ci?sslmode=disable
      # The test suite creates and drops its own books_test* databases here.
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
      PGSSLMODE: disable

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Apply migrations to an empty database
        working-directory: backend
        run: npm run migrate:up

      - name: Run backend tests
        working-directory: backend
        run: npm test

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build
